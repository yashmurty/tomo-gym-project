name: backend-tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests-workflow.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests-workflow.yml'

jobs:
  test_pull_request:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: tomo_gym
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5433
      DB_USER: root
      DB_PASS: example
      JWT_ACCESS_TOKEN_EXP_IN_SEC: 3600
      JWT_REFRESH_TOKEN_EXP_IN_SEC: 7200
      DEFAULT_ADMIN_USER_PASSWORD: example_admin_pass

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Tests only need *a* valid RS256 keypair, not a stable one, so generate
      # a throwaway pair per run instead of storing it as a repo secret.
      - name: Generate throwaway JWT keypair
        run: |
          openssl genrsa -out "$RUNNER_TEMP/jwt.key" 2048
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.key.pub"
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 "$RUNNER_TEMP/jwt.key")" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 "$RUNNER_TEMP/jwt.key.pub")" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: npm test
      - name: Build the docker compose stack
        run: docker compose -f docker-compose.yml up -d pgsqldb
      - name: Check running containers
        run: docker ps -a
      - name: Run e2e tests
        run: sleep 5 && npm run test:e2e
